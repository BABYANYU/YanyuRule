<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fafaf8">
  <meta name="description" content="多客户端规则库">
  <title>YanyuRule · 规则库</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="YanyuRule">
  <meta property="og:title" content="YanyuRule · 规则库">
  <meta property="og:description" content="多客户端规则库">
  <link rel="stylesheet" href="/style.css?v=contrast3">
</head>
<body>
  <a class="skip-link" href="#library">跳到规则库</a>
  <header class="topbar">
    <div class="header-inner">
      <a id="rules-home" class="brand" href="/" aria-label="YanyuRule 首页" aria-current="page">YanyuRule</a>
      <nav class="top-nav" aria-label="主导航">
        <button id="icons-open" class="nav-link" aria-pressed="false">图标库</button>
        <button id="about" class="nav-link" aria-pressed="false">关于</button>
      </nav>
    </div>
  </header>
  <main class="page-shell">
    <h1 class="sr-only">规则库</h1>
    <div class="workspace">
      <aside class="client-sidebar" aria-label="客户端导航">
        <div class="sidebar-inner">
          <p class="sidebar-label">客户端</p>
      <div class="tabs" role="tablist" aria-label="客户端" aria-orientation="vertical">
        <button role="tab" aria-selected="true" class="tab active" data-client="Surge">Surge <span class="client-count" id="count-Surge">—</span></button>
        <button role="tab" aria-selected="false" class="tab" data-client="Loon">Loon <span class="client-count" id="count-Loon">—</span></button>
        <button role="tab" aria-selected="false" class="tab" data-client="Egern">Egern <span class="client-count" id="count-Egern">—</span></button>
        <button role="tab" aria-selected="false" class="tab" data-client="Mihomo">Mihomo <span class="client-count" id="count-Mihomo">—</span></button>
        <button role="tab" aria-selected="false" class="tab" data-client="SingBox">sing-box <span class="client-count" id="count-SingBox">—</span></button>
        <button role="tab" aria-selected="false" class="tab" data-client="Surfboard">Surfboard <span class="client-count" id="count-Surfboard">—</span></button>
        <button role="tab" aria-selected="false" class="tab" data-client="QuantumultX">Quantumult X <span class="client-count" id="count-QuantumultX">—</span></button>
        <button role="tab" aria-selected="false" class="tab" data-client="Shadowrocket">Shadowrocket <span class="client-count" id="count-Shadowrocket">—</span></button>
      </div>
        </div>
      </aside>
    <section id="library" class="library" aria-label="规则库">
      <label class="mobile-client-picker">
        <span>客户端</span>
        <select id="client-select" aria-label="选择客户端">
          <option value="Surge">Surge</option><option value="Loon">Loon</option>
          <option value="Egern">Egern</option><option value="Mihomo">Mihomo</option>
          <option value="SingBox">sing-box</option><option value="Surfboard">Surfboard</option>
          <option value="QuantumultX">Quantumult X</option><option value="Shadowrocket">Shadowrocket</option>
        </select>
      </label>
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.75"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="search" type="search" placeholder="搜索规则名称…" aria-label="搜索规则名称、中文名称或说明" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <div id="filters" class="filters" aria-label="规则类型筛选">
          <button class="filter active" data-filter="all">全部</button>
          <button class="filter" data-filter="domain">域名</button>
          <button class="filter" data-filter="ip">IP</button>
          <button class="filter" data-filter="other">其他</button>
        </div>
      </div>
      <div class="results-heading">
        <span><strong id="result-count">—</strong> 项规则 <span class="separator">/</span> <span id="client-label">Surge</span></span>
        <label class="sort"><span>排序</span><select id="sort" aria-label="规则排序"><option value="name">名称 A–Z</option><option value="updated">最近更新</option><option value="size">规则数量</option></select></label>
      </div>
      <div id="grid" class="grid" aria-live="polite"></div>
      <div id="empty" class="empty" hidden>没有找到匹配的规则。换个关键词试试。</div>
      <div class="pagination">
        <span id="page-info" class="muted"></span>
        <div><button id="prev" class="page-button" aria-label="上一页">←</button><span id="page-number"></span><button id="next" class="page-button" aria-label="下一页">→</button></div>
      </div>
    </section>
    </div>
    <footer>
      <div class="sync"><span id="sync-mode">正在读取同步状态…</span><span class="separator">·</span><span id="sync-time"></span></div>
      <span class="copyright">© <span id="copyright-year">2026</span> YANYU</span>
    </footer>
  </main>
  <dialog id="detail" aria-labelledby="dialog-title">
    <div class="detail-header"><span class="eyebrow" id="detail-client"></span><button id="close" class="icon-button" aria-label="关闭弹窗">×</button></div>
    <div id="detail-body"></div>
  </dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="/app.js?v=contrast3"></script>
</body>
</html>
