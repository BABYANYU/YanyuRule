name: YanyuRule daily sync
on:
  schedule:
    - cron: '0 16 * * *' # UTC 16:00 = 北京时间次日 00:00
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yanyurule-production
  cancel-in-progress: false
jobs:
  request-and-verify:
    if: vars.YANYURULE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm test
      - name: Request a Cloudflare build through the connected repository
        env:
          SYNC_REQUEST_ID: daily-${{ github.run_id }}-${{ github.run_attempt }}
          YANYURULE_PUBLIC_BASE_URL: ${{ vars.YANYURULE_PUBLIC_BASE_URL }}
        run: |
          git config user.name "YanyuRule sync"
          git config user.email "253015402+BABYANYU@users.noreply.github.com"
          node scripts/request-sync.mjs
      - name: Verify the requested data reached the public site
        env:
          SYNC_REQUEST_ID: daily-${{ github.run_id }}-${{ github.run_attempt }}
          YANYURULE_PUBLIC_BASE_URL: ${{ vars.YANYURULE_PUBLIC_BASE_URL }}
        run: node scripts/wait-for-deployment.mjs
